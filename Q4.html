<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
  </head>
  <body>
    <h2>Registration Form</h2>

    <form onsubmit="return validateForm()">
      <label>Name:</label><br />
      <input type="text" id="name" /><br /><br />

      <label>Email:</label><br />
      <input type="text" id="email" /><br /><br />

      <label>Password:</label><br />
      <input type="password" id="password" /><br /><br />

      <label>Phone Number:</label><br />
      <input type="text" id="phone" /><br /><br />

      <label>Date of Birth:</label><br />
      <input type="date" id="dob" /><br /><br />

      <button type="submit">Submit</button>
    </form>

    <p id="error" style="color: red"></p>

    <script>
      function validateForm() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value.trim();
        const dob = document.getElementById("dob").value;
        const error = document.getElementById("error");

        error.textContent = "";

        // Name validation (only alphabets, min 3)
        if (!nameRegex.test(name) || name.trim().length < 3) {
  error.textContent =
    "Name must contain at least 3 alphabets and only letters and spaces.";
  return false;
}

        // Email validation
        const emailRegex = /^[a-zA-Z0-9._]+@[a-zA-Z]+\.[a-zA-Z]{2,}$/;
        if (!emailRegex.test(email)) {
          error.textContent =
            "Enter a valid email address (username@domain.extension).";
          return false;
        }

        // Password validation
        const passwordRegex =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        if (!passwordRegex.test(password)) {
          error.textContent =
            "Password must be at least 8 characters long and include uppercase, lowercase, number, and special character.";
          return false;
        }

        // Phone number validation
        const phoneRegex = /^[0-9]{10}$/;
        if (!phoneRegex.test(phone)) {
          error.textContent = "Phone number must be exactly 10 digits.";
          return false;
        }

        // DOB validation
        if (dob === "") {
          error.textContent = "Please select your date of birth.";
          return false;
        }

        alert("Form submitted successfully!");
        return true;
      }
    </script>
  </body>
</html>
